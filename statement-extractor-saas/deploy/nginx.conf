# Place at /etc/nginx/sites-available/statement-extractor, symlink into
# sites-enabled, then `certbot --nginx` for TLS. Adjust server_name and
# upload size limit (must cover MAX_UPLOAD_SIZE_MB in backend/.env) as needed.

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.yourdomain.com;

    root /var/www/statement-extractor/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
